# Online Banking System Test Configuration

# Application URL
base.url=http://localhost:8080

# Browser Configuration
browser=chrome
chrome.driver.path=src/test/resources/drivers/chromedriver.exe
headless.mode=false

# Test Data
test.user1.username=user1
test.user1.password=password1
test.user1.email=user1@bank.com

test.user2.username=user2
test.user2.password=password2
test.user2.email=user2@bank.com

test.user3.username=user3
test.user3.password=password3
test.user3.email=user3@bank.com

admin.username=admin
admin.password=admin

# Timeouts (milliseconds)
implicit.wait=10000
explicit.wait=10000
page.load.timeout=30000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.path=target/screenshots/

# Report Configuration
report.path=target/test-output/ExtentReport.html
