<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header"/>
<body roleId="page-top" data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar"/>
<div class="container main">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="page-header">我的预约</h1>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3>预约列表</h3>
                </div>
                <div class="panel-body">
                    <table id="appointmentTable" class="table table-striped table-bordered" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th>日期时间</th>
                                <th>办理地点</th>
                                <th>备注</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-th-each="appointment : ${appointmentList}">
                                <td data-th-text="${#dates.format(appointment.date, 'yyyy-MM-dd HH:mm')}">...</td>
                                <td data-th-text="${appointment.location}">...</td>
                                <td data-th-text="${appointment.description}">...</td>
                                <td>
                                    <span th:if="${appointment.confirmed}" class="label label-success">已确认</span>
                                    <span th:unless="${appointment.confirmed}" class="label label-warning">待确认</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/header :: body-bottom-scripts"/>
<script>
$(document).ready(function() {
    $('#appointmentTable').DataTable();
});
</script>
</body>
</html>
