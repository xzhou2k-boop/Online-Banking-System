<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header"/>
<body roleId="page-top" data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar"/>
<div class="container main">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="page-header">管理员面板</h1>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-12">
            <ul class="nav nav-tabs">
                <li><a href="/admin/users">用户管理</a></li>
                <li><a href="/admin/appointments">预约管理</a></li>
                <li class="active"><a href="/admin/transactions">交易监控</a></li>
            </ul>
        </div>
    </div>
    
    <div class="tab-content">
        <div class="tab-pane active" id="transactions">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3>主账户交易记录</h3>
                </div>
                <div class="panel-body">
                    <table id="primaryTransactionTable" class="table table-striped table-bordered" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th>交易日期</th>
                                <th>描述</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>金额</th>
                                <th>可用余额</th>
                                <th>账户ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-th-each="transaction : ${primaryTransactionList}">
                                <td data-th-text="${#dates.format(transaction.date, 'yyyy-MM-dd HH:mm:ss')}">...</td>
                                <td data-th-text="${transaction.description}">...</td>
                                <td data-th-text="${transaction.type}">...</td>
                                <td>
                                    <span th:if="${transaction.status == 'Finished'}" class="label label-success">已完成</span>
                                    <span th:if="${transaction.status == 'Pending'}" class="label label-warning">待处理</span>
                                    <span th:unless="${transaction.status == 'Finished' or transaction.status == 'Pending'}" class="label label-default" data-th-text="${transaction.status}">...</span>
                                </td>
                                <td>
                                    <span th:if="${transaction.amount > 0}" class="text-danger" data-th-text="${'+' + transaction.amount}">...</span>
                                    <span th:if="${transaction.amount < 0}" class="text-success" data-th-text="${transaction.amount}">...</span>
                                </td>
                                <td data-th-text="${transaction.availableBalance}">...</td>
                                <td data-th-text="${transaction.primaryAccount.id}">...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3>储蓄账户交易记录</h3>
                </div>
                <div class="panel-body">
                    <table id="savingsTransactionTable" class="table table-striped table-bordered" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th>交易日期</th>
                                <th>描述</th>
                                <th>类型</th>
                                <th>状态</th>
                                <th>金额</th>
                                <th>可用余额</th>
                                <th>账户ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-th-each="transaction : ${savingsTransactionList}">
                                <td data-th-text="${#dates.format(transaction.date, 'yyyy-MM-dd HH:mm:ss')}">...</td>
                                <td data-th-text="${transaction.description}">...</td>
                                <td data-th-text="${transaction.type}">...</td>
                                <td>
                                    <span th:if="${transaction.status == 'Finished'}" class="label label-success">已完成</span>
                                    <span th:if="${transaction.status == 'Pending'}" class="label label-warning">待处理</span>
                                    <span th:unless="${transaction.status == 'Finished' or transaction.status == 'Pending'}" class="label label-default" data-th-text="${transaction.status}">...</span>
                                </td>
                                <td>
                                    <span th:if="${transaction.amount > 0}" class="text-danger" data-th-text="${'+' + transaction.amount}">...</span>
                                    <span th:if="${transaction.amount < 0}" class="text-success" data-th-text="${transaction.amount}">...</span>
                                </td>
                                <td data-th-text="${transaction.availableBalance}">...</td>
                                <td data-th-text="${transaction.savingsAccount.id}">...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/header :: body-bottom-scripts"/>
<script>
$(document).ready(function() {
    $('#primaryTransactionTable').DataTable({
        "order": [0, 'desc'],  // 初始按日期降序
        "columnDefs": [
            { "type": "date", "targets": 0 }  // 指定第一列为日期类型
        ]
    });
    $('#savingsTransactionTable').DataTable({
        "order": [0, 'desc'],  // 初始按日期降序
        "columnDefs": [
            { "type": "date", "targets": 0 }  // 指定第一列为日期类型
        ]
    });
});
</script>
</body>
</html>
