<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common-header"/>
<body roleId="page-top" data-spy="scroll" data-target=".navbar-fixed-top">
<head th:replace="common/header :: navbar"/>
<div class="container main">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="page-header">管理员面板</h1>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-12">
            <ul class="nav nav-tabs">
                <li class="active"><a href="/admin/users">用户管理</a></li>
                <li><a href="/admin/appointments">预约管理</a></li>
                <li><a href="/admin/transactions">交易监控</a></li>
            </ul>
        </div>
    </div>
    
    <div class="row">
        <div class="col-lg-12">
            <div class="panel panel-default">
                <div class="panel-heading">
                    <h3>用户列表</h3>
                </div>
                <div class="panel-body">
                    <table id="userTable" class="table table-striped table-bordered" cellspacing="0" width="100%">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>姓名</th>
                                <th>邮箱</th>
                                <th>电话</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr data-th-each="user : ${userList}">
                                <td data-th-text="${user.username}">...</td>
                                <td data-th-text="${user.firstName + ' ' + user.lastName}">...</td>
                                <td data-th-text="${user.email}">...</td>
                                <td data-th-text="${user.phone}">...</td>
                                <td>
                                    <span th:if="${user.enabled}" class="label label-success">已启用</span>
                                    <span th:unless="${user.enabled}" class="label label-danger">已禁用</span>
                                </td>
                                <td th:if="${user.username != 'admin'}">
                                    <span th:if="${user.enabled}">
                                        <a th:href="@{/admin/user/{username}/disable(username=${user.username})}" class="btn btn-danger btn-xs">禁用</a>
                                    </span>
                                    <span th:unless="${user.enabled}">
                                        <a th:href="@{/admin/user/{username}/enable(username=${user.username})}" class="btn btn-success btn-xs">启用</a>
                                    </span>
                                </td>
                                <td th:if="${user.username == 'admin'}">
                                    <span class="text-muted">系统管理员</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/header :: body-bottom-scripts"/>
<script>
$(document).ready(function() {
    $('#userTable').DataTable();
});
</script>
</body>
</html>
